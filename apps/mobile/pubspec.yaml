name: nqlah_mobile
description: "NQLAH (نقلة) — unified Saudi B2B freight marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.6.2
  # Fonts (Tajawal + Inter from Google Fonts)
  google_fonts: ^6.2.1
  # Icon set used by the design (Phosphor, Regular + Fill) as SVG assets,
  # rendered with flutter_svg (phosphor_flutter is incompatible with the
  # IconData-final change in this Flutter version).
  flutter_svg: ^2.0.10
  # i18n / numbers / dates
  intl: any
  # Networking (REST client to the NestJS API) + secure token storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.2.4
  file_picker: ^11.0.3
  url_launcher: ^6.3.3
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  cross_file: ^0.3.5+5
  socket_io_client: ^3.1.6
  video_player: ^2.14.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/regular/
    - assets/icons/fill/
    - assets/logo/
