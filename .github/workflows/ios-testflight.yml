name: iOS TestFlight

# Manual trigger (Actions tab → Run workflow). Build + upload to TestFlight on a
# GitHub-hosted macOS runner — no local Xcode needed. Signing is headless via
# the App Store Connect API key (secrets below).
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps
        working-directory: apps/mobile
        run: flutter pub get

      # Generates the Flutter artifacts + runs `pod install`; fastlane then
      # re-archives this with signing.
      - name: Flutter iOS build (no codesign)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        working-directory: apps/mobile/ios
        run: gem install fastlane --no-document

      - name: Build & upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: fastlane beta

      - name: Upload IPA artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/build/ios-ipa/*.ipa
          if-no-files-found: ignore
