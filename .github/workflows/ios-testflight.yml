name: iOS TestFlight

# Manual trigger (Actions tab → Run workflow). Build + upload to TestFlight on a
# GitHub-hosted macOS runner — no local Xcode needed. Signing is headless via
# the App Store Connect API key (secrets below).
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # firebase-ios-sdk 13.x (via firebase_messaging 17.x) needs Swift tools
      # 6.2, so the build requires a recent Xcode — pick the newest stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps
        working-directory: apps/mobile
        # Pre-create the SPM package dir: this project is Swift Package Manager
        # (no Podfile), and `flutter pub get` copies plugins (firebase_messaging)
        # into build/ios/SourcePackages — which rsync can't create on a clean
        # runner because its parent doesn't exist yet.
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      # Generates the Flutter artifacts + runs `pod install`; fastlane then
      # re-archives this with signing.
      - name: Flutter iOS build (no codesign)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        working-directory: apps/mobile/ios
        run: gem install fastlane --no-document

      - name: Build & upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: fastlane beta

      - name: Upload IPA artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/build/ios-ipa/*.ipa
          if-no-files-found: ignore
